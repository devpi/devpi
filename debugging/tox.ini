[pytest]
collect_ignore = .tox build
addopts =
    -r a
    -W once::DeprecationWarning
    -W once::pytest.PytestDeprecationWarning


[tox]
envlist=flake8


[testenv:flake8]
commands = flake8 --config .flake8
deps = flake8
skip_install = true


[testenv:mypy]
commands = mypy {posargs}
deps =
    mypy
    mypy-zope
