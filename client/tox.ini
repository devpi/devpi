[pytest]
collect_ignore = .tox build
addopts =
    -r a
    -W once::DeprecationWarning
    -W once::ResourceWarning
markers =
    nomocking: do not mock anything in fixtures
timeout = 60


[tox]
envlist = py37{,-server6,-setuptools6920,-version},py314,pypy3,flake8

[testenv]
passenv = GITHUB_ACTIONS, LANG, PIP_INDEX_URL
deps =
       pytest
       pytest-github-actions-annotate-failures!=0.3.0
       pytest-instafail
       pytest-timeout
       devpi-server;python_version>="3.9"
       pip
       pypitoken
       importlib.metadata;python_version<"3.8"
       mock
       sphinx
       webtest
       wheel
       tox
       setuptools6920: setuptools<=69.2.0

commands = py.test --instafail {posargs}


[testenv:pypy]
commands = py.test --instafail --timeout 300 {posargs}


[testenv:pypy3]
commands = py.test --instafail --timeout 300 {posargs}


[testenv:py37-version]
deps =
commands = devpi --version


[testenv:py37-server6]
commands = py.test --timeout 300 --instafail {posargs} --devpi-server-requirements "devpi-server==6.0.0" --devpi-server-requirements "ruamel.yaml" --devpi-server-requirements "setuptools<=81"


[testenv:flake8]
commands = flake8 --config .flake8
deps = flake8
skip_install = true


[testenv:mypy]
commands = mypy {posargs}
# the pins are for Python 3.7 support
deps =
    build<1.2
    mypy<1.9
    mypy-zope
    packaging<25
    pip<26.2
    platformdirs<4.6
    pytest<8
    setuptools<68
    types-requests
    urllib3<2.1
